<div class="stars-background">
    <div *ngFor="let star of stars" class="star" [style.left]="star.left" [style.top]="star.top"
        [style.animation-duration]="star.duration" [style.animation-delay]="star.delay">
    </div>
</div>

<div class="trainer-dashboard">
    <!-- Navigation Section -->
    <nav class="dashboard-nav">
        <div class="nav-brand">
            <h1>{{ welcomeMessage() || 'Trainer Portal' }}</h1>
        </div>
        <div class="nav-links">
            <a routerLink="/trainer/dashboard" routerLinkActive="active" class="nav-link">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                </span>
                <span>Dashboard</span>
            </a>
            <a routerLink="/trainer/assigned-trainings" routerLinkActive="active" class="nav-link">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                </span>
                <span>Assigned Trainings</span>
            </a>
            <a routerLink="/trainer/invoice-upload" routerLinkActive="active" class="nav-link">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </span>
                <span>Raise Invoice</span>
            </a>
            <!-- Merged Payment Status into History -->
            <a routerLink="/trainer/invoice-history" routerLinkActive="active" class="nav-link">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                </span>
                <span>Invoices & Payments</span>
                <span class="nav-icon">📜</span>
                <span>Payments</span>
            </a>
        </div>
        <div class="nav-actions">

            <button class="logout-btn" (click)="logout()">
                <span class="logout-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </span>
                <span>Logout</span>
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="dashboard-content">
        <router-outlet></router-outlet>
    </div>
</div>
