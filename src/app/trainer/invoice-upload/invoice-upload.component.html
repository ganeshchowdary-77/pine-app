<div class="invoice-upload">
  <div class="page-header">
    <h2>Upload Invoice</h2>
    <p>Submit new invoices for your completed training sessions</p>
  </div>
  
  <form [formGroup]="invoiceForm" (ngSubmit)="onSubmit()" class="invoice-form">
    <div class="form-group">
      <label for="poId">Purchase Order:</label>
      <select id="poId" formControlName="poId" class="form-control">
        <option value="">Select a PO</option>
        <option *ngFor="let po of purchaseOrders()" [value]="po.id">
          PO #{{ po.id }} - ${{ po.totalAmount }}
        </option>
      </select>
      <div class="error" *ngIf="invoiceForm.get('poId')?.invalid && invoiceForm.get('poId')?.touched">
        Please select a purchase order
      </div>
    </div>
    
    <div class="form-group">
      <label for="amount">Amount:</label>
      <input id="amount" type="number" formControlName="amount" class="form-control" placeholder="Enter amount">
      <div class="error" *ngIf="invoiceForm.get('amount')?.invalid && invoiceForm.get('amount')?.touched">
        Valid amount is required
      </div>
    </div>
    
    <div class="form-group">
      <label for="tax">Tax (optional):</label>
      <input id="tax" type="number" formControlName="tax" class="form-control" placeholder="Enter tax amount">
    </div>
    
    <div class="form-group">
      <label for="invoiceDate">Invoice Date:</label>
      <input id="invoiceDate" type="date" formControlName="invoiceDate" class="form-control">
      <div class="error" *ngIf="invoiceForm.get('invoiceDate')?.invalid && invoiceForm.get('invoiceDate')?.touched">
        Invoice date is required
      </div>
    </div>
    
    <div class="form-group">
      <label for="notes">Notes (optional):</label>
      <textarea id="notes" formControlName="notes" class="form-control" rows="3" placeholder="Additional notes"></textarea>
    </div>
    
    <div class="form-actions">
      <button type="submit" [disabled]="invoiceForm.invalid || isSubmitting" class="submit-btn">
        {{ isSubmitting ? 'Submitting...' : 'Submit Invoice' }}
      </button>
      <a routerLink="/trainer/dashboard" class="cancel-btn">Cancel</a>
    </div>
  </form>
  
  <div class="success-message" *ngIf="submitSuccess">
    <div class="success-icon">✅</div>
    <h4>Invoice Submitted Successfully!</h4>
    <p>Your invoice has been submitted for review.</p>
  </div>
  
  <div class="back-link">
    <a routerLink="/trainer/dashboard" class="back-btn">← Back to Dashboard</a>
  </div>
</div>
