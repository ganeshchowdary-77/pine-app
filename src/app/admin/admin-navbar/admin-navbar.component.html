<nav class="admin-navbar">
  <div class="navbar-container">

      <h2>🍍 Admin Panel</h2>

    <div class="navbar-menu" [class.open]="isMenuOpen()">

      </a>

      <a routerLink="/admin/training-requests" routerLinkActive="active" class="nav-link" (click)="isMenuOpen.set(false)">

      </a>

      <a routerLink="/admin/enrollments" routerLinkActive="active" class="nav-link" (click)="isMenuOpen.set(false)">
        👥 Enrollments
      </a>

      <a routerLink="/admin/trainer-invoices" routerLinkActive="active" class="nav-link" (click)="isMenuOpen.set(false)">

      <a routerLink="/admin/trainer-availability" routerLinkActive="active" class="nav-link" (click)="isMenuOpen.set(false)">
        📋 Trainer Availability
      </a>

      <div class="navbar-divider"></div>

      <div class="user-section">
        <span class="user-info">{{ currentUser()?.email || 'Admin' }}</span>

        </button>
      </div>
    </div>
