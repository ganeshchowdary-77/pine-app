<div class="flex h-screen bg-gray-50">

    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-lg z-10 flex flex-col">
        <!-- Logo Area -->
        <div class="h-16 flex items-center justify-center border-b border-gray-100">
            <h1 class="text-xl font-bold font-sans tracking-tight">
                <span class="text-yellow-500">Pine</span><span class="text-green-600">Apple</span>
                <span class="text-xs text-gray-400 font-normal ml-1">Admin</span>
            </h1>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">

            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-3">
                Enrollments
            </div>

            <a routerLink="/admin/enrollments"
                routerLinkActive="bg-yellow-50 text-yellow-700 border-r-4 border-yellow-400"
                [routerLinkActiveOptions]="{exact: true}"
                class="flex items-center px-3 py-2.5 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-50 hover:text-gray-900 group transition-colors">
                <span class="mr-3 text-lg">📋</span>
                All Enrollments
            </a>

            <a routerLink="/admin/enrollments/new"
                routerLinkActive="bg-yellow-50 text-yellow-700 border-r-4 border-yellow-400"
                class="flex items-center px-3 py-2.5 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-50 hover:text-gray-900 group transition-colors">
                <span class="mr-3 text-lg">➕</span>
                New Enrollment
            </a>

            <div class="mt-8 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-3">
                Purchase Orders
            </div>

            <a routerLink="/admin/purchase-orders/client/new"
                routerLinkActive="bg-green-50 text-green-700 border-r-4 border-green-500"
                class="flex items-center px-3 py-2.5 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-50 hover:text-gray-900 group transition-colors">
                <span class="mr-3 text-lg">🏢</span>
                Create Client PO
            </a>

            <a routerLink="/admin/purchase-orders/trainer/new"
                routerLinkActive="bg-green-50 text-green-700 border-r-4 border-green-500"
                class="flex items-center px-3 py-2.5 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-50 hover:text-gray-900 group transition-colors">
                <span class="mr-3 text-lg">👨‍🏫</span>
                Generate Trainer PO
            </a>

        </nav>

        <!-- User Profile (Bottom) -->
        <div class="border-t border-gray-100 p-4">
            <div class="flex items-center">
                <div
                    class="h-8 w-8 rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center text-white font-bold text-xs shadow-sm">
                    A
                </div>
                <div class="ml-3">
                    <p class="text-sm font-medium text-gray-700">Admin User</p>
                    <p class="text-xs text-gray-500">admin@pine.app</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden">

        <!-- Top Header -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shadow-sm z-10">
            <h2 class="text-lg font-semibold text-gray-800">
                <!-- Breadcrumbs could go here -->
                Dashboard
            </h2>

            <div class="flex items-center space-x-4">
                <button class="p-2 text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-100 transition-colors">
                    <span class="sr-only">Notifications</span>
                    🔔
                </button>
                <button class="p-2 text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-100 transition-colors">
                    <span class="sr-only">Settings</span>
                    ⚙️
                </button>
            </div>
        </header>

        <!-- Main Content Scrollable -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-6">
            <div class="max-w-7xl mx-auto">
                <router-outlet></router-outlet>
            </div>
        </main>
    </div>

</div>
