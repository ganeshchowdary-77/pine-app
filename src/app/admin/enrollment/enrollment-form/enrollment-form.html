<div class="container mx-auto p-4 max-w-lg">
    <h2 class="text-2xl font-bold mb-6">{{ enrollmentId() ? 'Edit Enrollment' : 'Create Enrollment' }}</h2>

    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">

        <!-- Company -->
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Company</label>
            <select formControlName="companyId"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option [ngValue]="null">Select Company</option>
                @for (c of companies(); track c.id) {
                <option [value]="c.id">{{ c.name }}</option>
                }
            </select>
        </div>

        <!-- Trainer -->
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Trainer</label>
            <select formControlName="trainerId"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option [ngValue]="null">Select Trainer</option>
                @for (t of trainers(); track t.id) {
                <option [value]="t.id">{{ t.name }}</option>
                }
            </select>
        </div>

        <!-- Technology -->
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Technology</label>
            <input type="text" formControlName="technology"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Start Date -->
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Start Date</label>
            <input type="date" formControlName="startDate"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- End Date -->
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">End Date</label>
            <input type="date" formControlName="endDate"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Budget -->
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Budget</label>
            <input type="number" formControlName="budget"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Status -->
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Status</label>
            <select formControlName="status"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="REQUESTED">Requested</option>
                <option value="APPROVED">Approved</option>
                <option value="ONGOING">Ongoing</option>
                <option value="COMPLETED">Completed</option>
            </select>
        </div>

        <div class="flex items-center justify-between mt-6">
            <button type="submit" [disabled]="form.invalid"
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded disabled:opacity-50">
                {{ enrollmentId() ? 'Update Enrollment' : 'Create Enrollment' }}
            </button>

            <a routerLink="/admin/enrollments" class="text-gray-600 hover:text-gray-800">Cancel</a>
        </div>

    </form>
</div>
