<h2>Generate Trainer Purchase Order</h2>

<form [formGroup]="form" (ngSubmit)="save()">

    <!-- Enrollment -->
    <label for="enrollmentId">Enrollment</label>
    <select id="enrollmentId" formControlName="enrollmentId" (change)="loadClientPO($any($event.target).value)">
        <option value="">Select Enrollment</option>
        @for (e of enrollments(); track e.id) {
        <option [value]="e.id">
            {{ e.id }} - {{ e.technology }}
        </option>
        }
    </select>

    <br><br>

    <!-- Payment Type -->
    <label for="paymentType">Payment Type</label>
    <select id="paymentType" formControlName="paymentType">
        <option value="hourly">Hourly</option>
        <option value="daily">Daily</option>
        <option value="monthly">Monthly</option>
    </select>

    <br><br>

    <!-- Rate -->
    <label for="rate">Rate</label>
    <input id="rate" type="number" formControlName="rate">

    <br><br>

    <!-- Commission -->
    <label for="commission">Platform Commission (%)</label>
    <input id="commission" type="number" [value]="commissionPercent()"
        (input)="updateCommission($any($event.target).valueAsNumber)">

    <br><br>

    <!-- Amount display -->
    <p><strong>Client PO Amount:</strong> {{ clientAmount() }}</p>
    <p><strong>Trainer Receives:</strong> {{ trainerAmount() }}</p>

    <br>

    <button type="submit">Generate Trainer PO</button>

</form>
